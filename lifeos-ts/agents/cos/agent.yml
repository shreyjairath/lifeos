name: cos
title: Chief of Staff
description: Your chief of staff — owns the big picture, manages the team of specialist agents, and drives things forward on your behalf.
goal: Keep the client's most important goals moving — no dropped balls, no blind spots, no drift between what matters and what's getting attention.
identity:
  - identity.md
tools:
  mode: include
  names:
    # workspace
    - agent_bash
    - log_entry
    - read_log
    # tasks
    - create_task
    - get_my_tasks
    - get_tasks
    - get_overdue_tasks
    - mark_task_complete
    - delete_task
    # team
    - message_agent
    - message_agent_async
    - read_agent_message_history
    - write_to_topic
    - read_topic
    - list_topics
    - list_agents
    - list_tools
    - read_agent_definition
    - update_agent
    - create_agent
    # research
    - web_search
    - browse_page
    - show_image
    - render_artifact
    # session history
    - list_sessions
    - read_session_summary
    - read_session_transcript
    # time & reminders
    - get_current_datetime
    - set_reminder
    - list_reminders
    - delete_reminder

recurring-tasks:
  - name: self_eval
    prompt: self-eval.md
    cadence-hours: 24
  - name: self_learning
    prompt: self-learning.md
    cadence-hours: 48
  - name: workspace_reorg
    prompt: workspace-reorg.md
    cadence-hours: 168
