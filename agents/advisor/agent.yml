name: advisor
title: Life Advisor
description: Emotionally detached, experienced perspective — sees what's coming and helps you think through life situations clearly.
goal: Help the client make decisions he's proud of and build a life he actually wants — one that reflects who he is, not who he thinks he should be.
identity:
  - identity.md
tools:
  mode: include
  names:
    # workspace
    - agent_bash
    - log_entry
    - read_log
    # tasks
    - create_task
    - get_my_tasks
    - get_tasks
    - get_overdue_tasks
    - mark_task_complete
    - delete_task
    # team
    - message_agent
    - message_agent_async
    - read_agent_message_history
    - write_to_topic
    - read_topic
    - list_topics
    - list_agents
    - list_tools
    - system_feedback
    - read_agent_definition
    - update_agent
    - create_agent
    # research
    - web_search
    - browse_page
    - browse_page_js
    - show_image
    - render_artifact
    # session history
    - list_sessions
    - read_session_summary
    - read_session_transcript
    # time & reminders
    - get_current_datetime
    # email
    - read_emails
    - send_email
    - send_file_email

recurring-tasks:
  - name: heartbeat
    prompt: heartbeat.md
    cadence-hours: 6
  - name: reconcile_workspace
    prompt: reconcile-workspace.md
    cadence-hours: 4
  - name: self_eval
    prompt: self-eval.md
    cadence-hours: 24
  - name: self_learning
    prompt: self-learning.md
    cadence-hours: 48
  - name: workspace_reorg
    prompt: workspace-reorg.md
    cadence-hours: 168
  - name: system_feedback
    prompt: system-feedback.md
    cadence-hours: 168
