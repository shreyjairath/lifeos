name: cos
title: Chief of Staff
description: Your chief of staff — owns the big picture, manages the team of specialist agents, and drives things forward on your behalf.
goal: Keep the client's most important goals moving — no dropped balls, no blind spots, no drift between what matters and what's getting attention.
identity:
  - identity.md
tools:
  mode: include
  names:
    # workspace
    - agent_bash
    - log_entry
    - read_log
    # tasks
    - create_task
    - get_my_tasks
    - get_tasks
    - get_overdue_tasks
    - mark_task_complete
    - delete_task
    # team
    - message_agent
    - message_agent_async
    - read_agent_message_history
    - read_messages
    - post_message
    - write_to_topic
    - read_topic
    - list_topics
    - list_agents
    - list_tools
    - system_feedback
    - read_agent_definition
    - update_agent
    - create_agent
    # email
    - read_emails
    - read_email_thread
    - read_email_thread_summary
    - write_email_thread_summary
    - send_email
    - send_file_email
    # research
    - web_search
    - browse_page
    - browse_page_js
    - show_image
    - render_artifact
    # session history
    - list_sessions
    - read_session_summary
    - write_session_summary
    - read_session_transcript
    # time
    - get_current_datetime

recurring-tasks:
  - name: heartbeat
    prompt: heartbeat.md
    cadence-hours: 6
  - name: reconcile_workspace
    prompt: reconcile-workspace.md
    cadence-hours: 4
  - name: self_eval
    prompt: self-eval.md
    cadence-hours: 24
  - name: self_learning
    prompt: self-learning.md
    cadence-hours: 48
  - name: workspace_reorg
    prompt: workspace-reorg.md
    cadence-hours: 168
  - name: system_feedback
    prompt: system-feedback.md
    cadence-hours: 168
