server:
  port: 8000

lifeos:
  model: minimax/minimax-m2.7
  background-model: minimax/minimax-m2.7
  reasoning:
    effort: medium
  session:
    token-threshold: 100000
    time-threshold-hours: 4
  heartbeat:
    cron: "0 0 */4 * * *"
  session-expiry-check:
    cron: "0 0 * * * *"
  gmail:
    webhook-secret: ${GMAIL_WEBHOOK_SECRET}
    pubsub-topic: projects/YOUR_PROJECT/topics/lifeos-email
  mcp-servers:
    - name: gmail
      command: npx
      args: ["-y", "@gongrzhe/server-gmail-autoauth-mcp"]
      env:
        GMAIL_TOKEN_PATH: .user-data/system/gmail/token.json
