server:
  port: 8000

lifeos:
  api-key: your_openrouter_api_key_here
  model: anthropic/claude-sonnet-4-5
  background-model: anthropic/claude-haiku-4-5-20251001
  reasoning:
    effort: medium
  session:
    token-threshold: 100000
    time-threshold-hours: 4
  heartbeat:
    cron: "0 0 */4 * * *"
  session-expiry-check:
    cron: "0 0 * * * *"
