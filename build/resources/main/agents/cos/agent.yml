name: cos
title: Chief of Staff
description: Your chief of staff — owns the big picture, manages the team of specialist agents, and drives things forward on your behalf.
identity:
  - identity.md
tools:
  mode: include
  names:
    # workspace
    - agent_bash
    - log_entry
    - read_log
    - schedule_task
    - get_scheduled_tasks
    - get_overdue_tasks
    - mark_task_complete
    # team
    - message_agent
    - read_agent_message_history
    - list_agents
    - list_tools
    - read_agent_definition
    - update_agent
    - create_agent
    # research
    - web_search
    - browse_page
    - show_image
    - render_artifact
    # session history
    - list_sessions
    - read_session_summary
    - read_session_transcript
    # time & reminders
    - get_current_datetime
    - set_reminder
    - list_reminders
    - delete_reminder

background-modes:
  - trigger: heartbeat_trigger
    prompt: heartbeat.md
  - trigger: self_eval_trigger
    prompt: self-eval.md
  - trigger: self_learning_trigger
    prompt: self-learning.md
