<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lifeos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Mobile header -->
    <div id="mobile-header">
      <button id="hamburger" aria-label="Menu">☰</button>
      <span>lifeos</span>
      <button id="new-chat-mobile" aria-label="New chat">＋</button>
    </div>
    <div id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>lifeos</h1>
      </div>

      <div class="sidebar-spacer"></div>

      <div id="agent-toggle">
        <button class="agent-btn active" data-agent="main">Main</button>
        <button class="agent-btn" data-agent="therapist">Therapist</button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>

      <hr class="sidebar-divider">

      <section class="sidebar-section">
        <h2>Recent</h2>
        <ul id="conv-list"><li class="empty">No sessions yet</li></ul>
      </section>

<section class="sidebar-section">
        <h2>Knowledge</h2>
        <ul id="knowledge-list">
          <li><a href="#" data-file="agent-notes">Agent Notes</a></li>
        </ul>
      </section>

    </aside>

    <!-- Main -->
    <main id="main">
      <div id="messages"></div>
      <div id="input-area">
        <textarea id="input" placeholder="Ask your agent anything…" rows="1"></textarea>
        <button id="mic-btn" title="Tap to speak" aria-label="Microphone">🎤</button>
        <button id="voice-mode-btn" title="Voice mode — auto-listen after agent responds" aria-label="Voice mode">🔊</button>
        <button id="stop-btn" style="display:none">Stop</button>
        <button id="send-btn">Send</button>
      </div>
    </main>

    <!-- Inspector / Claude Code sidecar -->
    <aside id="inspector">
      <!-- Tab bar -->
      <div class="isp-tabbar">
        <button class="isp-tab active" data-tab="prompt">Prompt</button>
        <button class="isp-tab" data-tab="events">Events</button>
        <button class="isp-tab" data-tab="inspector">Inspector</button>
        <button class="isp-tab" data-tab="cc">Claude Code</button>
        <button id="inspector-copy" title="Copy JSON" style="display:none">Copy</button>
      </div>

      <!-- Prompt parts editor panel -->
      <div id="prompt-panel">
        <div id="prompt-file-list"></div>
        <div id="prompt-editor-area">
          <textarea id="prompt-editor" spellcheck="false"></textarea>
          <div id="prompt-editor-footer">
            <button id="prompt-set-active-btn">Set as active</button>
            <span id="prompt-save-status"></span>
            <button id="prompt-save-btn">Save</button>
          </div>
        </div>
      </div>

      <!-- Events panel -->
      <div id="events-panel" class="hidden">
        <div id="events-body"></div>
      </div>

      <!-- Inspector panel -->
      <div id="inspector-panel" class="hidden">
        <div id="inspector-body">
          <span class="inspector-empty">Request JSON will appear here after you send a message.</span>
        </div>
      </div>

      <!-- Claude Code chat panel -->
      <div id="cc-panel" class="hidden">
        <div id="cc-messages"></div>
        <div id="cc-input-area">
          <textarea id="cc-input" placeholder="Ask Claude Code about lifeos…" rows="1"></textarea>
          <button id="cc-send">Send</button>
        </div>
      </div>

    </aside>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
