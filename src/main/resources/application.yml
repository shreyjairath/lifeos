server:
  port: 8000

spring:
  web:
    resources:
      static-locations:
        - file:src/main/resources/static/
        - classpath:/static/
  devtools:
    restart:
      additional-paths: src/main/java
    livereload:
      enabled: true

lifeos:
  api-key: ${OPENROUTER_API_KEY}
  model: minimax/minimax-m2.7
  background-model: minimax/minimax-m2.7
  reasoning:
    effort: medium        # "low" | "medium" | "high" — or use max-tokens instead
  session:
    token-threshold: 100000
    time-threshold-hours: 4
  session-expiry-check:
    cron: "0 0 * * * *"      # top of every hour
  scheduled-triggers:
    - type: heartbeat_trigger
      cron: "0 0 */6 * * *"  # midnight, 6am, noon, 6pm
    - type: self_eval_trigger
      cron: "0 0 5 * * *"    # 5am daily
    - type: self_learning_trigger
      cron: "0 0 3 * * *"    # 3am daily
