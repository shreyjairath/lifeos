server:
  port: 8000

spring:
  devtools:
    restart:
      additional-paths: src/main/java
    livereload:
      enabled: true

lifeos:
  model: claude-sonnet-4-6
  anthropic-api-key: ${ANTHROPIC_API_KEY}
  paths:
    environment: .user-data/environment
    user: .user-data/user
  session:
    token-threshold: 50000
    time-threshold-hours: 4
