server:
  port: 8000

spring:
  web:
    resources:
      static-locations:
        - file:src/main/resources/static/
        - classpath:/static/
  devtools:
    restart:
      additional-paths: src/main/java
    livereload:
      enabled: true

lifeos:
  api-key: ${OPENROUTER_API_KEY}
  model: minimax/minimax-m2.7
  background-model: minimax/minimax-m2.7
  reasoning:
    effort: medium        # "low" | "medium" | "high" — or use max-tokens instead
  session:
    token-threshold: 100000
    time-threshold-hours: 4
  heartbeat:
    cron: "0 0 */4 * * *"    # every 4 hours
  session-expiry-check:
    cron: "0 0 * * * *"      # top of every hour
  mcp-servers:
    - name: gmail
      command: npx
      args: ["-y", "@gongrzhe/server-gmail-autoauth-mcp"]
      env:
        GMAIL_TOKEN_PATH: .user-data/system/gmail/token.json
