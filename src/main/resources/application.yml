server:
  port: 8000

spring:
  web:
    resources:
      static-locations:
        - file:src/main/resources/static/
        - classpath:/static/
  devtools:
    restart:
      additional-paths: src/main/java
    livereload:
      enabled: true

lifeos:
  model: claude-sonnet-4-6
  reflect-model: claude-opus-4-6
  anthropic-api-key: ${ANTHROPIC_API_KEY}
  paths:
    environment: .user-data/environment
    user: .user-data/user
  session:
    token-threshold: 50000
    time-threshold-hours: 4
  heartbeat:
    interval-ms: 14400000  # 4 hours
